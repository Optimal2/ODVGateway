name: Release

# Publishes an official ODVGateway release when a vX.Y.Z tag is pushed.
#
# The rest of this repository's Actions are workflow_dispatch-only by deliberate
# choice (see AGENTS.md) - the real gate is scripts/local-ci.ps1 before a push.
# This workflow is the documented exception, for the same reason OpenDocViewer
# has one: publishing a release means building artifacts and attaching them to a
# tag, which has to happen on a clean machine from the tagged commit, not from
# whatever a developer had on disk.
#
# The approval gate is a maintainer running scripts/release.ps1 -Publish. That
# creates the tag; this workflow only reacts to it.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build configuration (dispatch runs only; a tag always releases Release)'
        type: choice
        options:
          - Debug
          - Release
        default: 'Release'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # A tag always builds Release. The dispatch input exists for running the
      # checks against Debug and must never be able to publish a Debug build.
      CONFIGURATION: ${{ github.event_name == 'push' && 'Release' || inputs.configuration }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Validate tag format
        if: github.event_name == 'push'
        shell: bash
        run: |
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$tag' does not match the required vX.Y.Z pattern." >&2
            exit 1
          fi

      - name: Check out ODVGateway
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET SDK info
        run: dotnet --info

      # The tag and the version in the tree must agree. A mismatch means the tag
      # was moved or created by hand, and the published binaries would then carry
      # a version the release name contradicts.
      - name: Verify tag matches Directory.Build.props
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $text = Get-Content Directory.Build.props -Raw
          $m = [regex]::Match($text, '<Version>\s*([0-9]+\.[0-9]+\.[0-9]+)\s*</Version>')
          if (-not $m.Success) { throw 'No <Version> element found in Directory.Build.props.' }
          $version = $m.Groups[1].Value
          $tag = '${{ github.ref_name }}'
          if ("v$version" -ne $tag) {
            throw "Tag $tag does not match Directory.Build.props version $version."
          }
          Write-Host "Tag $tag matches version $version."

      - name: Restore
        run: dotnet restore src/ODVGateway/ODVGateway.csproj

      - name: Build
        run: dotnet build src/ODVGateway/ODVGateway.csproj --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Unit tests
        run: dotnet test tests/ODVGateway.Tests/ODVGateway.Tests.csproj --configuration ${{ env.CONFIGURATION }} --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: warn

      - name: Smoke test
        shell: pwsh
        run: pwsh -File scripts/smoke-test.ps1 -Port 5210

      - name: Validate component versions
        shell: pwsh
        run: pwsh -File scripts/validate-component-versions.ps1 -BaseCommit 'origin/main'

      # Framework-dependent: the target is IIS on a host that already has the
      # ASP.NET Core hosting bundle, which is how the gateway is deployed today.
      - name: Publish application
        run: dotnet publish src/ODVGateway/ODVGateway.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output publish/ODVGateway

      - name: Package release archive
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -notmatch '^v[0-9]') { $tag = 'local' }
          Compress-Archive -Path 'publish/ODVGateway/*' -DestinationPath "ODVGateway-$tag.zip" -Force
          Get-ChildItem "ODVGateway-$tag.zip" | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length/1MB,2)) MB" }

      - name: Verify release notes exist
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $path = "release-notes/${{ github.ref_name }}.md"
          if (-not (Test-Path -LiteralPath $path)) {
            throw "$path is missing. It is the release body; publishing without it would produce an empty release."
          }
          Write-Host "Found $path."

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ODVGateway ${{ github.ref_name }}
          body_path: release-notes/${{ github.ref_name }}.md
          draft: false
          files: |
            ODVGateway-${{ github.ref_name }}.zip
